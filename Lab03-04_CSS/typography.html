<!DOCTYPE html>
<html>
<head>

<title>Typography Task</title>

<link rel="stylesheet" href="../styles/typography.css">

<style>

h2{
font-size:30px;
text-align:center;
}

p{
font-size:18px;
line-height:1.6;
}

.bold{
font-weight:bold;
}

.italic{
font-style:italic;
}

.upper{
text-transform:uppercase;
}

</style>

</head>

<body>

<h2>Typography Styling</h2>

<p>This is normal text.</p>

<p class="bold">This is bold text.</p>

<p class="italic">This is italic text.</p>

<p class="upper">this text becomes uppercase.</p>

</body>
</html>
