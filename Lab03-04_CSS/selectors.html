<!DOCTYPE html>
<html>
<head>
<title>Selectors Practice</title>

<link rel="stylesheet" href="../styles/main.css">

<style>


p{
color:blue;
}

.box{
background:lightgray;
}

#special{
color:red;
}


input[type="text"]{
border:2px solid green;
}

input[type="email"]{
border:2px solid blue;
}

a[href]{
color:purple;
}



div p{
font-weight:bold;
}

ul > li{
color:orange;
}

h1 + p{
font-style:italic;
}

h1 ~ ul{
background:#eee;
}



a:hover{
color:red;
}

li:first-child{
font-weight:bold;
}

li:last-child{
color:green;
}

input:focus{
background:yellow;
}

button:hover{
background:green;
color:white;
}

</style>

</head>

<body>

<h1>CSS Selectors</h1>

<p>this is a Normal paragraph</p>

<p class="box">This is a Class selector example</p>

<p id="special">this is a ID selector example</p>

<div>
<p>Descendant selector example</p>
</div>

<ul>
<li>Computer Scientist</li>
<li>Robotics</li>
<li>Artificil intelligence</li>
</ul>

<a href="https://stock.adobe.com/search?k=4k+technology">Technology random website link</a>

<br><br>

<input type="text" placeholder="Enter name">
<input type="email" placeholder="Enter email">

<button>Submit</button>

</body>
</html>
